<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Version Monitoring System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
    /* =========================
   GITHUB-STYLE TREE SIDEBAR
========================= */
.at-header{

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:10px 16px;

    background:#ffffff;

    border-bottom:1px solid #e5e7eb;

    margin:-18px -18px 14px -18px;

    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

/* LEFT */
.at-left{
    display:flex;
    flex-direction:column;
    gap:2px;
}

/* TITLE */
.at-title{
    font-size:14.5px;
    font-weight:600;
    color:#111827;
}

/* PATH / DESCRIPTION */
.at-path{
    font-size:11.5px;
    color:#6b7280;
}

/* RIGHT SIDE */
.at-right{
    display:flex;
    align-items:center;
    gap:10px;
}

/* CHIP */
.at-chip{

    font-size:11px;
    font-weight:600;

    padding:4px 10px;

    border-radius:999px;

    background:#f9fafb;

    border:1px solid #e5e7eb;

    color:#111827;

    cursor:pointer;

    transition:0.15s ease;
}

.at-chip:hover{
    border-color:#cbd5e1;
    background:#ffffff;
}

/* separator */
.at-sep{
    width:1px;
    height:14px;
    background:#e5e7eb;
}

/* STATE */
.at-state{
    font-size:11px;
    color:#6b7280;
}
.sidebar {
    width: 270px;
    background: #ffffff;
    height: 100vh;
    border-right: 1px solid #d0d7de;
    padding: 12px 10px;
    position: fixed;
    overflow-y: auto;

    font-size: 13px;
}

/* title */
.sidebar h2 {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    color: #57606a;
    margin: 0 0 12px 8px;
    letter-spacing: .4px;
}

/* system block */
.system {
    margin-bottom: 2px;
}

/* =========================
   HEADER
========================= */

.system-header {
    display: flex;
    align-items: center;
    gap: 6px;

    padding: 5px 8px;

    border-radius: 6px;

    cursor: pointer;
    user-select: none;

    color: #24292f;
    font-size: 13px;
    font-weight: 400;

    transition: background .12s ease;
}

.system-header:hover {
    background: #f6f8fa;
}

/* active */
.system-header.active {
    background: #e7f3ff;
    color: #0969da;
    font-weight: 600;
}

/* =========================
   ARROW
========================= */

.tree-arrow {
    width: 12px;
    min-width: 15px;
    font-size: 13px;
    color: #899098;
    transition: transform .12s ease;
    font-weight: bold;
    margin-right: 8px;
    margin-left: -3px;
}

/* rotate when open */
.system.open .tree-arrow {
    transform: rotate(90deg);
}

/* =========================
   FOLDER ICON
========================= */
.folder-svg path {
    fill: #54aeff; /* closed color */
   
}

.folder-svg {
    width: 16px;
    height: 16px;
    transition: .15s ease;
}

/* closed */
.folder-closed {
    fill: #54aeff;
}

/* opened */
.system.open .folder-closed {
    fill: #d29922;
}

/* =========================
   NAME
========================= */

.system-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* =========================
   TREE CONTENT
========================= */

.system-content {
    display: none;
    margin-left: 18px;
    padding-left: 10px;

    border-left: 1px solid #d8dee4;
}

/* open */
.system.open .system-content {
    display: block;
}

/* =========================
   VERSION FILE
========================= */

.tree-item{
    display:flex;
    align-items:center;
    gap:6px;
    margin-left: 10px;
}

.tree-file-icon{
    display:flex;
    align-items:center;
    font-size: 15px;
}

.file-svg{
    width:16px;
    height:16px;
    fill:currentColor;
    flex-shrink:0;
}
/* hover */
.tree-item:hover {
    background: #f6f8fa;
    color: #0969da;
}

/* active file */
.tree-item.active {
    background: #e7f3ff;
    color: #0969da;
    font-weight: 600;
}


.meta-pill {
    background: #f6f8fa;
    border: 1px solid #d0d7de;
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 11px;
    color: #24292f;
}
/* HAS CHANGES → GREEN on hover */
.panel-section ul li.add:hover::before {
    background: #74dc2e !important;
}

/* NO CHANGES → RED on hover */
.panel-section ul li.none:hover::before {
    background: #cf222e;
}
.panel-section,
.panel-section ul {
    overflow: visible;
}
.right-panel {
    position: fixed;
    right: 0;
    top: 0;
    width: 340px;
    height: 100vh;

    background: #ffffff;
    border-left: 1px solid #d0d7de;

    padding: 14px;
    overflow-y: auto;

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;

    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

/* =========================
   HEADER
========================= */

.right-panel h3 {
   
    top: 0;
    z-index: 10;

    margin: -14px -14px 10px -14px;
    padding: 12px 14px;

    font-size: 13px;
    font-weight: 600;
    color: #24292f;

    background: #ffffff;
    border-bottom: 1px solid #d0d7de;
}

/* =========================
   SECTION (better structure for empty / minimal content)
========================= */

.panel-section {
    margin-bottom: 10px;
    padding: 10px;

    border: none;
    border-radius: 6px;

    background: #ffffff;

    min-height: 48px;
}

.panel-section h4 {
    font-size: 11px;
    font-weight: 600;
    color: #57606a;

    margin: 0 0 8px 0;

    letter-spacing: 0.5px;
    text-transform: uppercase;
}

/* =========================
   LIST (clean + better readability for sparse content)
========================= */

.panel-section ul {
    margin: 0;
    padding: 0;
    position: relative;
}

/* timeline line only shows when items exist (visually subtle fallback) */
.panel-section ul:empty::before {
    content: "No items";
    position: relative;
    display: block;

    font-size: 12px;
    color: #8c959f;
    padding-left: 6px;
}

.panel-section ul:not(:empty)::before {
    content: "";
    position: absolute;
    left: 7px;
    top: 6px;
    bottom: 6px;

    width: 1px;
    background: #d0d7de;
}

.panel-section ul li {
    list-style: none;

    position: relative;

    font-size: 13px;
    line-height: 1.45;
    color: #24292f;

    padding: 6px 10px 6px 20px;
    margin: 0;

    display: flex;
    align-items: center;
    gap: 8px;

    border-radius: 6px;

    word-break: break-word;
}

/* commit dot */
.panel-section ul li::before {
    content: "";
    position: absolute;
    left: 3px;
    top: 50%;
    transform: translateY(-50%);

    width: 7px;
    height: 7px;
    border-radius: 50%;

    background: #d0d7de;
    border: 2px solid #ffffff;
}

/* hover minimal */
.panel-section ul li:hover {
    background: #f6f8fa;
}

/* active state subtle */
.panel-section ul li.active {
    background: #f1f8ff;
    color: #0969da;
    font-weight: 500;
}

.panel-section ul li.active::before {
    background: #0969da;
}

.panel-section ul li + li {
    margin-top: 2px;
}

/* =========================
   EMPTY STATE (important improvement for "minimal text")
========================= */

.panel-section:has(ul:empty) {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 60px;
    color: #8c959f;
    font-size: 12px;
}

/* =========================
   BADGES
========================= */

.add { color: #1a7f37; font-weight: 600; }
.fix { color: #0969da; font-weight: 600; }
.remove { color: #cf222e; font-weight: 600; }

/* =========================
   SCROLLBAR
========================= */

.right-panel::-webkit-scrollbar {
    width: 7px;
}

.right-panel::-webkit-scrollbar-thumb {
    background: #d0d7de;
    border-radius: 999px;
}

.right-panel::-webkit-scrollbar-thumb:hover {
    background: #b0b8c1;
}

/* =========================
   DRAG HANDLE
========================= */

.right-panel::before {
    content: "";
    position: absolute;
    left: -2px;
    top: 0;
    width: 4px;
    height: 100%;
    cursor: col-resize;
    background: transparent;
}


/* THIS is the actual draggable edge */
.right-panel::before {
    content: "";
    position: absolute;
    left: -4px;
    top: 0;
    width: 8px;
    height: 100%;
    cursor: col-resize;
    background: transparent;
}

/* visible hover hint (modern UX like VSCode) */
.right-panel::before:hover {
    background: rgba(9,105,218,0.08);
}
.version {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 14px;

    transition: all 0.2s ease;
    cursor: pointer;
}

/* REMOVE old "flat feeling" and replace with depth on hover */
.version:hover {
    transform: translateY(-3px);
    border-color: #c9d3df;
    box-shadow: 0 10px 25px rgba(0,0,0,0.06);
}

/* ACTIVE STATE = subtle focus ring (modern UI pattern) */
.version:not(.collapsed) {
    border-color: #b8c4d3;
    box-shadow: 0 0 0 3px rgba(9,105,218,0.08);
    background: #fcfdff;
}

/* LEFT DOT INDICATOR (instead of border bar — more modern) */
.version::before {
    content: "";
    position: absolute;
    left: -7px;
    top: 22px;
    width: 10px;
    height: 10px;
    background: #c7ced8;
    border-radius: 50%;
    border: 2px solid #f6f8fa;
}

/* ACTIVE DOT */
.version:not(.collapsed)::before {
    background: #0969da;
}

/* HOVER DOT */
.version:hover::before {
    background: #6b7280;
}

/* TITLE STYLE IMPROVEMENT */
.version h3 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.2px;
}

/* META CLEANER */
.meta {
    font-size: 12.5px;
    color: #6b7280;
    margin-top: 6px;
}

/* TAG REFINED (LESS BLOCKY) */
.tag {
    background: #111827;
    color: #fff;
    font-size: 10px;
    padding: 3px 7px;
    border-radius: 999px;
    margin-left: 6px;
    opacity: 0.9;
}

/* DETAILS FEEL MORE STRUCTURED */
.version-details {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed #e5e7eb;
}

/* LIST TIGHTER AND CLEANER */
.version-details ul li {
    font-size: 13px;
    line-height: 1.5;
    color: #374151;
}
/* subtle page depth */
body {
    background: linear-gradient(180deg, #f6f8fa 0%, #f3f6fb 100%);
}

/* smoother scroll */
html {
    scroll-behavior: smooth;
}

/* sidebar polish */
.sidebar {
    box-shadow: 2px 0 12px rgba(0,0,0,0.03);
}

/* system active indicator */
.system-header.active {
    position: relative;
}

.system-header.active::before {
    content: "";
    position: absolute;
    left: -8px;
    top: 4px;
    bottom: 4px;
    width: 4px;
    background: var(--primary);
    border-radius: 2px;
}

/* version card hover lift */
.version {
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}

.version:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    border-color: #c9d4e5;
}

/* active opened version highlight */
.version:not(.collapsed) {
    border-color: #b6d4ff;
}

/* right panel upgrade (slight glass feel) */
.right-panel {
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(6px);
}

/* sidebar links smoother feel */
.system-content a {
    transition: all 0.15s ease;
}

/* tag glow */
.tag {
    box-shadow: 0 2px 6px rgba(25, 135, 84, 0.25);
}

/* scrollbar styling */
::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-track {
    background: #f1f3f6;
}

::-webkit-scrollbar-thumb {
    background: #c7ced8;

}

::-webkit-scrollbar-thumb:hover {

}

/* panel section smoother spacing */

}

/* subtle header emphasis */

}

.header p {

</style>

<style>
 /* =========================
   GITHUB-STYLE LIST ITEM
========================= */
/* FULLSCREEN MODAL FIXED (GITHUB STYLE LIGHTBOX) */
#ghModal {
    position: fixed !important;
    inset: 0 !important;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,0.88);

    z-index: 999999 !important; /* force above EVERYTHING */

    padding: 20px;
}

/* IMAGE CENTER FIX */
#ghModalImg {
    display: block;
    margin: auto;

    max-width: 92%;
    max-height: 92%;

    border-radius: 12px;

    box-shadow: 0 25px 70px rgba(0,0,0,0.6);

    transform: scale(0.95);
    transition: 0.15s ease;
}
.gh-item {
    position: relative;
    padding: 8px 10px 8px 18px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
     z-index: 1;
}

/* left subtle dot like GitHub timeline */
.gh-item::before {
    content: "";
    position: absolute;
    left: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #d0d7de;
}

/* hover feel (very GitHub-like) */
.gh-item:hover {
    background: #f6f8fa;
    transform: translateX(2px);
     position: relative;
    z-index: 9999;
}

/* text styling */
.gh-text {
    font-size: 13px;
    line-height: 1.5;
    color: #24292f;
}

/* =========================
   PREVIEW POPUP (MODERN GLASS STYLE)
========================= */

.gh-preview {
    position: absolute;
    left: 304px;
    top: 32px;

    width: 220px;
    height: 140px;

    border-radius: 10px;
    overflow: hidden;

    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);

    border: 1px solid #d0d7de;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);

    display: none;
      z-index: 99999; /* important */
}

/* image */
.gh-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* label */
.gh-preview-label {
    position: absolute;
    bottom: 6px;
    right: 8px;

    font-size: 10px;
    padding: 2px 6px;
    border-radius: 999px;

    background: rgba(0,0,0,0.6);
    color: #fff;
}

/* show on hover */
.gh-item:hover .gh-preview {
    display: block;
    animation: pop 0.12s ease-out;
}

@keyframes pop {
    from {
        opacity: 0;
        transform: translateY(6px) scale(0.98);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.file-tags {
    display: inline-flex;
    gap: 6px;
    margin-left: 6px;
    align-items: center;
    vertical-align: middle;
}

/* BASE TAG — SaaS smart badge */
.file-tag {
    position: relative;

    font-size: 10px;
    font-weight: 600;

    padding: 3px 9px;
    border-radius: 999px;

    display: inline-flex;
    align-items: center;
    gap: 4px;

    line-height: 1;

    white-space: nowrap;

    background: #ffffff;

    color: #111827;

    border: 1px solid rgba(17, 24, 39, 0.12);

    letter-spacing: 0.2px;

    transition: all 0.15s ease;

    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}

/* hover = SaaS lift */
.file-tag:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    border-color: rgba(17, 24, 39, 0.2);
}

/* IMAGE — soft sky blue (Vercel-like tone) */
.file-tag.img {
    background: #eff6ff;
    color: #2563eb;
    border-color: #bfdbfe;
}

/* PDF — soft coral red (Stripe-like alert tone) */
.file-tag.pdf {
    background: #fef2f2;
    color: #dc2626;

    document.querySelectorAll(".system-header").forEach(header => {

        header.onclick = function () {

            const parent = this.closest(".system");

            const isOpen = parent.classList.toggle("open");

            // CLOSE OTHER SYSTEMS
            document.querySelectorAll(".system").forEach(sys => {
                if (sys !== parent) {

                    sys.classList.remove("open");

                    const folder = sys.querySelector(".folder-path");

/* VERSION SORT */
function compareVersions(a, b) {
    const pa = (a.version || "0.0.0").split(".").map(Number);
    const pb = (b.version || "0.0.0").split(".").map(Number);

    for (let i = 0; i < 3; i++) {
        const diff = (pb[i] || 0) - (pa[i] || 0);
        if (diff !== 0) return diff;
    }
    return 0;
}

/* DIFF (NO REMOVED) */
function diffArrays(current = [], previous = []) {
    return {
        added: current.filter(x => !previous.includes(x))
    };
}

function getPreviousVersion(system, id) {
    const sys = systemsData.find(s => s.system === system);
    if (!sys) return null;

    const sorted = [...sys.versions].sort(compareVersions);
    const index = sorted.findIndex(v => v.id === id);

    return sorted[index + 1] || null;
}

function getAttachmentStats(v) {

                stats.total++;

                if (type === "image") stats.img++;
                else if (type === "pdf") stats.pdf++;
            });
        });
    }

    scan(v.newFeatures);
    scan(v.improvements);
    scan(v.fixes);

    return stats;
}

                    // =========================
                    if (first.type === "pdf") {

                        if (!pdfThumbCache[first.file]) {

                            pdfThumbCache[first.file] = "loading";

                            let pdfUrl = first.file
                                .replace("raw.githubusercontent.com", "cdn.jsdelivr.net/gh")
                                .replace("/main/", "@main/");

                            generatePdfThumbnail(pdfUrl, (thumb) => {

                                pdfThumbCache[first.file] = thumb;

                                if (window.currentRenderTarget) {
                                    renderRightPanel(window.currentRenderTarget);
                                }
                            });
                        }

                        previewHTML = `
                            <div class="gh-preview"
                                 data-files='${JSON.stringify(attachments)}'>

                                ${
                                    pdfThumbCache[first.file] &&
                                    pdfThumbCache[first.file] !== "loading"
                                    ? `<img src="${pdfThumbCache[first.file]}">`
                                    : `<div style="
                                            display:flex;
                                            align-items:center;
                                            justify-content:center;
                                            height:100%;
                                            font-size:12px;
                                            color:#57606a;
                                        ">Loading...</div>`
                                }

                                <div class="gh-preview-label">
                                    ${attachments.length > 1 ? attachments.length + " files" : "PDF"}
                                </div>

                            </div>
                        `;
                    }

                    // =========================
                    // IMAGE PREVIEW
                    // =========================
                    else {

                        previewHTML = `
                            <div class="gh-preview"
                                 data-files='${JSON.stringify(attachments)}'>

                                <img src="${first.file}">

                                <div class="gh-preview-label">
                                    ${attachments.length > 1 ? attachments.length + " files" : "IMAGE"}
                                </div>

                            </div>
                        `;
                    }
                }

                return `
                <li class="gh-item add"
                    ${hasAttachments ? `data-files='${JSON.stringify(attachments)}'` : ""}>

                    <!-- TEXT -->
                    <span class="gh-text">
                        ${text}

                        <!-- FILE TAGS WITH COUNTS -->
                        ${
                            hasAttachments
                                ? `<span class="file-tags">

    ${
        imgCount > 0
            ? `<span class="file-tag img">
                    IMG
                    <span class="file-tag-count">${imgCount}</span>
               </span>`
            : ""
    }

    ${
        pdfCount > 0
            ? `<span class="file-tag pdf">
                    PDF
                    <span class="file-tag-count">${pdfCount}</span>
               </span>`
            : ""
    }

</span>`
                                : ""
                        }
                    </span>

                    ${previewHTML}

                </li>
                `;
            }).join("")}

        </ul>

    </div>`;
}

/* CONTENT */
function renderContent() {
    const container = document.getElementById("container");

    let data;

    // 1. BUILD DATA FIRST
    if (!currentSystem) {
        data = systemsData.flatMap(s =>
            s.versions.map(v => ({ ...v, system: s.system }))
        );
    } else {
        const sys = systemsData.find(s => s.system === currentSystem);
        data = sys ? sys.versions.map(v => ({ ...v, system: sys.system })) : [];
    }

    // 2. SORT FIRST
    data.sort(compareVersions);

    // 3. BUILD LATEST MAP
    const latestMap = {};
    systemsData.forEach(sys => {
        const sorted = [...sys.versions].sort(compareVersions);
        if (sorted.length) latestMap[sys.system] = sorted[0].id;
    });

    // 4. APPLY FILTER (ONLY AFTER latestMap exists)
    if (currentSystem === null) {
        data = data.filter(v => latestMap[v.system] === v.id);
    }

    // 5. HEADER
    document.querySelector(".header h1").innerText =
        currentSystem ? currentSystem : "All Systems";

    // 6. RENDER
    container.innerHTML = data.map(v => `
        <div class="version collapsed" id="${v.id}" onclick="toggleVersion('${v.id}')">

            <h3>
                v${v.version}
                ${v.id === latestMap[v.system] ? '<span class="tag">Latest</span>' : ''}
            </h3>

            <div class="meta">
               ${v.system} • ${
  v.datetime
    ? new Date(v.datetime).toLocaleString("en-US", {
        year: "numeric",
        month: "long",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit",
        hour12: true
      })
    : ""
}
            </div>

            <div class="version-details">
                <ul>
                    ${v.title ? `<li>${v.title}</li>` : ""}
                </ul>
            </div>
        </div>
    `).join("");
}

/* CLICK */
function toggleVersion(id) {
    document.querySelectorAll(".version").forEach(v => {
        if (v.id !== id) v.classList.add("collapsed");
        else v.classList.toggle("collapsed");
    });

    const v = systemsData
        .flatMap(s => s.versions.map(v => ({ ...v, system: s.system })))
        .find(x => x.id === id);

    if (v) renderRightPanel(v);
}


const rightPanel = document.getElementById("rightPanel");
const content = document.querySelector(".content");

let isDragging = false;
let startX = 0;
let startWidth = 320;

rightPanel.addEventListener("pointerdown", (e) => {
    // only trigger if near left edge
    if (e.offsetX > 10) return;

    isDragging = true;
    startX = e.clientX;
    startWidth = rightPanel.offsetWidth;

    document.body.style.userSelect = "none";
});

document.addEventListener("pointermove", (e) => {
    if (!isDragging) return;

    const dx = startX - e.clientX;
    let newWidth = startWidth + dx;

    // clamp
    newWidth = Math.min(Math.max(newWidth, 280), 720);

    rightPanel.style.width = newWidth + "px";
    content.style.marginRight = (newWidth + 20) + "px";
});

document.addEventListener("pointerup", () => {
    isDragging = false;
    document.body.style.userSelect = "";
});
document.addEventListener("DOMContentLoaded", () => {
    const maxWidth = 720;

    rightPanel.style.width = maxWidth + "px";
    content.style.marginRight = (maxWidth + 50) + "px";
});

        <div style="

`;

document.getElementById("viewerWrapper").appendChild(header);

// CLOSE ACTION
document.getElementById("closeViewerBtn").onclick = function (ev) {
    ev.stopPropagation();

    // hide viewer (adjust based on your modal structure)
    document.getElementById("ghModal").style.display = "none";
};
    //document.getElementById("viewerWrapper").appendChild(header);

    // =========================
    // PDF
    // =========================
    if (file.type === "pdf") {

        const iframe = document.createElement("iframe");

        const pdfUrl = file.file
            .replace("raw.githubusercontent.com", "cdn.jsdelivr.net/gh")
            .replace("/main/", "@main/");

        iframe.src =
            "https://mozilla.github.io/pdf.js/web/viewer.html?file=" +
            encodeURIComponent(pdfUrl);

        iframe.style.cssText = `
            width:100%;
            height:100%;
            border:none;
            border-radius:12px;
            background:white;
        `;

        viewerContent.appendChild(iframe);
    }

    // =========================
    // IMAGE
    // =========================
    else {

        const img = document.createElement("img");

        img.src = file.file;

        img.style.cssText = `
            max-width:100%;
            max-height:100%;
            border-radius:12px;
            box-shadow:0 20px 60px rgba(0,0,0,0.5);

    }

        ${index + 1} / ${files.length}
    `;

    // =========================
    // SHOW/HIDE ARROWS
    // =========================
    document.getElementById("prevFileBtn").style.display =
        files.length > 1 ? "block" : "none";

    document.getElementById("nextFileBtn").style.display =
        files.length > 1 ? "block" : "none";
}

    // INITIAL
    renderFile(currentIndex);

    // NEXT
    document.getElementById("nextFileBtn").onclick = function (ev) {
        ev.stopPropagation();

        currentIndex++;

        if (currentIndex >= files.length) {
            currentIndex = 0;
        }

        renderFile(currentIndex);
    };

    // PREV
    document.getElementById("prevFileBtn").onclick = function (ev) {
        ev.stopPropagation();

        currentIndex--;

        if (currentIndex < 0) {
            currentIndex = files.length - 1;
        }

        renderFile(currentIndex);
    };

});

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const pdfThumbCache = {};

  async function generatePdfThumbnail(pdfUrl, callback) {
    const loadingTask = pdfjsLib.getDocument(pdfUrl);

    const pdf = await loadingTask.promise;
    const page = await pdf.getPage(1); // FIRST PAGE ONLY

    const viewport = page.getViewport({ scale: 0.5 });

    const canvas = document.createElement("canvas");
    const context = canvas.getContext("2d");

    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await page.render({
        canvasContext: context,
        viewport: viewport
    }).promise;

    callback(canvas.toDataURL()); // returns image base64
}


document.addEventListener("mouseover", function (e) {

    const item = e.target.closest(".gh-item");
    if (!item) return;

    const preview = item.querySelector(".gh-preview");
    if (!preview) return;

    const files = JSON.parse(preview.dataset.files || "[]");

    if (files.length <= 1) return;

    // PREVENT MULTIPLE INTERVALS
    if (preview._interval) return;

    let index = 0;

    preview._interval = setInterval(() => {

        index = (index + 1) % files.length;

        const file = files[index];

        // =========================
        // IMAGE
        // =========================
        if (file.type === "image") {

            preview.innerHTML = `
                <img src="${file.file}">

                <div class="gh-preview-label">
                    IMAGE • ${index + 1} / ${files.length}
                </div>
            `;
        }

        // =========================
        // PDF
        // =========================
        else if (file.type === "pdf") {

            // CREATE THUMB IF NOT EXIST
            if (!pdfThumbCache[file.file]) {

                pdfThumbCache[file.file] = "loading";

                let pdfUrl = file.file
                    .replace(
                        "raw.githubusercontent.com",
                        "cdn.jsdelivr.net/gh"
                    )
                    .replace("/main/", "@main/");

                generatePdfThumbnail(pdfUrl, (thumb) => {

                    pdfThumbCache[file.file] = thumb;

                    preview.innerHTML = `
                        <img src="${thumb}">

                        <div class="gh-preview-label">
                            PDF • ${index + 1} / ${files.length}
                        </div>
                    `;
                });

                preview.innerHTML = `
                    <div style="
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        height:100%;
                        font-size:12px;
                        color:#57606a;
                    ">
                        Loading PDF...
                    </div>

                    <div class="gh-preview-label">
                        PDF • ${index + 1} / ${files.length}
                    </div>
                `;
            }

            // USE CACHE
            else if (pdfThumbCache[file.file] !== "loading") {

                preview.innerHTML = `
                    <img src="${pdfThumbCache[file.file]}">

                    <div class="gh-preview-label">
                        PDF • ${index + 1} / ${files.length}
                    </div>
                `;
            }
        }

    }, 1200);
});


document.addEventListener("mouseout", function (e) {

    const item = e.target.closest(".gh-item");
    if (!item) return;

    const preview = item.querySelector(".gh-preview");

    if (!preview || !preview._interval) return;

    clearInterval(preview._interval);

    preview._interval = null;
});
